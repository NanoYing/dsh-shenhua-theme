name: Release
# SPDX-License-Identifier: MPL-2.0

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          pnpm release:check

      - name: Build release package
        run: |
          pnpm pack --pack-destination dist
          cp LICENSING.md NOTICE.md dist/
          cd dist
          sha256sum ./*.tgz LICENSING.md NOTICE.md > SHA256SUMS.txt

      - name: Prepare version notes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const section = readFileSync('CHANGELOG.md', 'utf8').split(/^## /m)
            .find(text => text.startsWith(`${version} - `));
          if (!section) throw new Error('Missing release notes');
          writeFileSync('dist/RELEASE_NOTES.md', `## ${section}\n许可范围和第三方素材说明见附件 LICENSING.md、NOTICE.md。安装包含对应源码和构建配置。\n`);
          NODE

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tgz \
            dist/SHA256SUMS.txt \
            dist/LICENSING.md \
            dist/NOTICE.md \
            --verify-tag \
            --title "dsh-theme-shenhua $GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md
